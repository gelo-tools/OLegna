<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magrabi Universal POS Scanner</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2C3E50;
            --accent: #3498DB;
            --success: #27AE60;
            --warning: #F39C12;
            --bg: #F4F7F6;
            --card: #FFFFFF;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        
        .container { max-width: 1000px; margin: auto; display: grid; gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #EEE; padding-bottom: 10px; margin-bottom: 20px; }
        h2 { margin: 0; color: var(--primary); }
        
        /* Toggle Mode Buttons */
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { 
            flex: 1; padding: 15px; border: 2px solid #EEE; border-radius: 8px; cursor: pointer; 
            text-align: center; font-weight: bold; color: #7F8C8D; transition: 0.3s; background: transparent;
        }
        .mode-btn.active.specs { border-color: var(--accent); background: #EBF5FB; color: var(--accent); }
        .mode-btn.active.lens { border-color: var(--success); background: #EAFAF1; color: var(--success); }

        /* Scanner Area */
        .scanner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .scanner-grid { grid-template-columns: 1fr; } }
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #EEE; }
        .result-box { background: #F8F9FA; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); }
        
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .status-ready { background: #E8F8F5; color: #1ABC9C; }
        
        .form-group { margin-top: 15px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #CCC; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        input[type="file"] { padding: 10px 0; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; transition: 0.2s; color: white;}
        .btn-primary { background: var(--primary); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); }
        .btn:disabled { background: #BDC3C7; cursor: not-allowed; }

        /* Autocomplete Styles */
        .autocomplete-container { position: relative; }
        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #CCC;
            border-radius: 4px;
            max-height: 350px; 
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #EEE;
            font-size: 0.85rem;
            color: #333;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #EAF2F8; color: var(--accent); font-weight: bold; }
        
        .helper-text { font-size: 0.8rem; color: #7F8C8D; margin-top: 4px; display: block; }
        
        .action-buttons { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="setupCard">
        <h2><i class="fa-solid fa-database"></i> Load Magrabi Master Database</h2>
        <p style="color: #7F8C8D;">Upload your 'Combined SKU.csv' file to initialize the system.</p>
        <input type="file" id="csvFileInput" accept=".csv">
        <button class="btn btn-primary" id="loadBtn" onclick="processCSV()">Load Database</button>
        <div id="loadStatus" style="margin-top:10px; font-weight:bold; color: var(--success);"></div>
    </div>

    <div class="card" id="scannerCard" style="display: none;">
        <div class="header">
            <h2><i class="fa-solid fa-qrcode"></i> Universal POS Scanner</h2>
            <button class="btn btn-primary" style="width: auto; margin:0;" onclick="exportTranslation()"><i class="fa-solid fa-file-export"></i> Export Lens Mappings</button>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active specs" id="btnSpecs" onclick="setMode('specs')">
                <i class="fa-solid fa-glasses"></i> Suns & Specs Mode<br><small>(Direct POS Scan)</small>
            </button>
            <button class="mode-btn lens" id="btnLens" onclick="setMode('lens')">
                <i class="fa-solid fa-eye"></i> Contact Lens Mode<br><small>(AI Vision & Translate)</small>
            </button>
        </div>

        <div class="scanner-grid">
            <div>
                <div class="form-group">
                    <label style="font-weight: bold;">Manual Entry (or use physical scanner gun):</label>
                    <input type="text" id="manualBarcode" placeholder="Scan or type barcode here and hit Enter..." autocomplete="off">
                </div>
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #EEE;">
                <div id="reader"></div>
                <button id="startCamBtn" class="btn btn-primary" onclick="startScanner()"><i class="fa-solid fa-camera"></i> Start Camera / QR Scanner</button>
            </div>

            <div>
                <div class="result-box">
                    <div id="statusIndicator" class="status-badge status-ready">Ready to Scan</div>
                    <h3 id="detectedBarcode" style="margin: 10px 0; color: var(--primary);">---</h3>
                    
                    <div id="specsUI">
                        <label style="font-size: 0.85rem; color: #7F8C8D;">Item Description (From Database):</label>
                        <div id="specsResult" style="font-size: 1.2rem; font-weight: bold; margin-top: 5px; color: var(--primary);">Waiting for scan...</div>
                    </div>

                    <div id="lensUI" style="display: none;">
                        <label style="font-size: 0.85rem; color: #7F8C8D;">OCR Box Text (Lens Mode Camera Only):</label>
                        <div id="ocrResult" style="font-family: monospace; font-size: 0.9rem; margin-top: 5px; color: #555; background: #FFF; padding: 8px; border: 1px solid #EEE;">
                            Awaiting camera scan...
                        </div>
                        
                        <div class="form-group">
                            <label style="font-weight: bold; font-size: 0.9rem;">Wildcard Search & Link:</label>
                            <span class="helper-text">Tip: Use <b>%</b> as a wildcard. Example: <i>iClinic%-%1.25</i></span>
                            <div class="autocomplete-container">
                                <input type="text" id="predictedDesc" placeholder="Type to search database dynamically..." autocomplete="off">
                                <div id="descSuggestions" class="suggestions-dropdown"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label style="font-weight: bold; font-size: 0.9rem;">Magrabi POS Barcode (SKU):</label>
                            <input type="text" id="posBarcode" placeholder="Enter corresponding Magrabi SKU to link...">
                        </div>
                        
                        <div class="action-buttons">
                            <button class="btn btn-success" onclick="confirmMapping()"><i class="fa-solid fa-check"></i> Confirm Mapping</button>
                            <button class="btn btn-warning" onclick="cancelAndResume()"><i class="fa-solid fa-rotate-right"></i> Cancel & Scan Next</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let database = { specs: {}, lenses: {} };
    let currentMode = 'specs';
    let html5QrcodeScanner;
    let lensMappings = JSON.parse(localStorage.getItem('magrabi_lens_mappings')) || {};

    function processCSV() {
        const fileInput = document.getElementById('csvFileInput').files[0];
        if (!fileInput) return alert("Please select the 'Combined SKU' CSV file.");

        const btn = document.getElementById('loadBtn');
        btn.disabled = true;
        btn.innerText = "Parsing Data (Please Wait)...";

        Papa.parse(fileInput, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                let specsCount = 0; let lensCount = 0;
                results.data.forEach(row => {
                    const category = String(row['Merchandise Category'] || "").trim().toUpperCase();
                    const article = String(row['Article'] || "").trim();
                    const desc = String(row['Article Description'] || "").trim();
                    if (!article) return;

                    if (category.startsWith('CL') || category.startsWith('CS')) {
                        database.lenses[article] = desc;
                        lensCount++;
                    } else {
                        database.specs[article] = desc;
                        specsCount++;
                    }
                });

                document.getElementById('loadStatus').innerText = `Success! Loaded ${specsCount} General Items & ${lensCount} Lenses.`;
                setTimeout(() => {
                    document.getElementById('setupCard').style.display = 'none';
                    document.getElementById('scannerCard').style.display = 'block';
                    document.getElementById('manualBarcode').focus();
                }, 1500);
            }
        });
    }

    const predictedDescInput = document.getElementById('predictedDesc');
    const descSuggestions = document.getElementById('descSuggestions');

    predictedDescInput.addEventListener('input', function() {
        const rawQuery = this.value.toLowerCase().trim();
        descSuggestions.innerHTML = ''; 
        
        if (rawQuery.length < 2) {
            descSuggestions.style.display = 'none';
            return;
        }

        const escapedParts = rawQuery.split('%').map(part => part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const regexPattern = escapedParts.join('.*');
        const searchRegex = new RegExp(regexPattern, 'i'); 

        let matches = [];
        for (const [sku, desc] of Object.entries(database.lenses)) {
            if (searchRegex.test(desc)) {
                matches.push({ sku, desc });
                if (matches.length >= 100) break; 
            }
        }

        if (matches.length > 0) {
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<strong>${match.desc}</strong> <br><small style="color: #7F8C8D;">SKU: ${match.sku}</small>`;
                div.onclick = function() {
                    predictedDescInput.value = match.desc;     
                    document.getElementById('posBarcode').value = match.sku; 
                    descSuggestions.style.display = 'none';    
                };
                descSuggestions.appendChild(div);
            });
            descSuggestions.style.display = 'block';
        } else {
            descSuggestions.style.display = 'none';
        }
    });

    document.addEventListener('click', function(e) {
        if (e.target.id !== 'predictedDesc') {
            descSuggestions.style.display = 'none';
        }
    });

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnSpecs').className = `mode-btn specs ${mode === 'specs' ? 'active' : ''}`;
        document.getElementById('btnLens').className = `mode-btn lens ${mode === 'lens' ? 'active' : ''}`;
        document.getElementById('specsUI').style.display = mode === 'specs' ? 'block' : 'none';
        document.getElementById('lensUI').style.display = mode === 'lens' ? 'block' : 'none';
        
        resetUI();
        resumeCamera();
        document.getElementById('manualBarcode').focus();
    }

    document.getElementById('manualBarcode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const code = this.value.trim();
            if (code) processBarcode(code, false);
            this.value = ''; 
        }
    });

    function startScanner() {
        document.getElementById('startCamBtn').style.display = 'none';
        html5QrcodeScanner = new Html5Qrcode("reader");
        
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                html5QrcodeScanner.pause(); // Pause to let user confirm
                processBarcode(decodedText, true);
            },
            () => {}
        ).catch(err => {
            console.error(err);
            alert("Camera access denied or unavailable.");
            document.getElementById('startCamBtn').style.display = 'block';
        });
    }

    // --- Helper function to robustly wake the camera up ---
    function resumeCamera() {
        try {
            if (html5QrcodeScanner) {
                // 3 is the internal state code for PAUSED in the library
                if (html5QrcodeScanner.getState() === 3) {
                    html5QrcodeScanner.resume();
                } else {
                    // Fallback to force it if the state machine is confused
                    html5QrcodeScanner.resume();
                }
            }
        } catch (err) {
            // Camera is already running or not yet initialized, safe to ignore
        }
    }

    function processBarcode(barcode, isCamera) {
        document.getElementById('detectedBarcode').innerText = barcode;
        
        if (currentMode === 'specs') {
            const desc = database.specs[barcode] || database.lenses[barcode];
            const resultDiv = document.getElementById('specsResult');
            
            if (desc) {
                resultDiv.innerText = desc;
                resultDiv.style.color = "var(--success)";
            } else {
                resultDiv.innerText = "Item Not Found in Master Database.";
                resultDiv.style.color = "#E74C3C";
            }
            if (isCamera) setTimeout(() => resumeCamera(), 2000);
            
        } else if (currentMode === 'lens') {
            if (lensMappings[barcode]) {
                document.getElementById('predictedDesc').value = lensMappings[barcode].desc;
                document.getElementById('posBarcode').value = lensMappings[barcode].pos;
                document.getElementById('ocrResult').innerText = "Loaded from Local Translation Memory.";
            } else {
                if (isCamera) {
                    document.getElementById('ocrResult').innerText = "Running OCR on Box Image...";
                    captureAndRunOCR(barcode);
                } else {
                    document.getElementById('ocrResult').innerText = "Manual scan. No camera image to OCR.";
                    predictLensLogic(barcode, ""); 
                }
            }
        }
    }

    function captureAndRunOCR(barcode) {
        const video = document.querySelector('#reader video');
        if (!video) return predictLensLogic(barcode, ""); 

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; 
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        Tesseract.recognize(canvas.toDataURL('image/jpeg'), 'eng')
            .then(({ data: { text } }) => {
                const cleanedText = text.trim() || "No text found on box.";
                document.getElementById('ocrResult').innerText = cleanedText;
                predictLensLogic(barcode, cleanedText);
            })
            .catch(err => {
                document.getElementById('ocrResult').innerText = "OCR Failed.";
                predictLensLogic(barcode, "");
            });
    }

    function predictLensLogic(barcode, ocrText) {
        const powerMatch = ocrText.match(/[+-]\d{1,2}\.\d{2}/);
        const power = powerMatch ? powerMatch[0] : "";
        
        if (power) {
            predictedDescInput.value = `%-%${power}`;
            const event = new Event('input', { bubbles: true });
            predictedDescInput.dispatchEvent(event);
        } else {
            predictedDescInput.value = "";
        }
    }

    function confirmMapping() {
        const barcode = document.getElementById('detectedBarcode').innerText;
        const pos = document.getElementById('posBarcode').value.trim();
        const desc = document.getElementById('predictedDesc').value;

        if (!pos || barcode === "---") return alert("Please ensure a valid barcode is scanned and a POS SKU is entered.");

        lensMappings[barcode] = { 
            pos: pos, 
            desc: desc, 
            timestamp: new Date().toISOString() 
        };
        localStorage.setItem('magrabi_lens_mappings', JSON.stringify(lensMappings));
        
        alert("Lens successfully mapped and saved to Translation Table!");
        
        resetUI();
        resumeCamera(); // <--- Correctly wakes up the scanner
        document.getElementById('manualBarcode').focus();
    }

    // New Function for the Cancel Button
    function cancelAndResume() {
        resetUI();
        resumeCamera();
        document.getElementById('manualBarcode').focus();
    }

    function resetUI() {
        document.getElementById('detectedBarcode').innerText = "---";
        document.getElementById('specsResult').innerText = "Waiting for scan...";
        document.getElementById('ocrResult').innerText = "Awaiting camera scan...";
        document.getElementById('predictedDesc').value = "";
        document.getElementById('posBarcode').value = "";
    }

    function exportTranslation() {
        if (Object.keys(lensMappings).length === 0) {
            return alert("No lens mappings exist yet! Scan and link items first.");
        }

        let csv = "Manufacturer_Barcode,Magrabi_POS_SKU,Description,Date_Mapped\n";
        for (const [mfgBarcode, data] of Object.entries(lensMappings)) {
            const cleanDesc = data.desc.replace(/"/g, '""'); 
            csv += `"${mfgBarcode}","${data.pos}","${cleanDesc}","${data.timestamp}"\n`;
        }
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = 'Magrabi_Lens_Translation_Table.csv';
        a.click();
    }
</script>

</body>
</html>
